<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <button id="open-btn">
        <p>Enter the unkown</p>
    </button>

    <div id="modal-container">
        <div id="modal">
            <p>
                Welcome, Traveler.
                <br>
                You've stepped beyond the boundaries of the known world.
                There's no map for what comes next.
                Are you sure you want to continue?
            </p>

            <div id="close-btn">&times;</div>
        </div>
    </div>

    <script src="script/script.js"></script>

</body>

</html>
